name: CI

# Documentation-only changes skip CI: HACS validation, hassfest and the test
# suite read the integration, not the prose. A path here is only safe to ignore
# if no job inspects it -- hacs.json, manifest.json, strings.json and
# translations/ are all validated, so they must never be added.
#
# This is coupled to release.yml's gate, which refuses to publish a tag whose
# commit has no passing CI run. A release commit always edits manifest.json, so
# it still triggers CI; but a tag placed on a docs-only commit will be refused,
# and the fix is the one the gate already prints -- dispatch CI for that SHA by
# hand (Actions -> CI -> Run workflow).
#
# The two lists below are duplicated on purpose: GitHub Actions does not
# support YAML anchors, so an alias here would parse locally and fail on
# GitHub. Keep them in sync by hand.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'examples/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'examples/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: HACS validation
        uses: hacs/action@main # intentionally unpinned — see Template best practices, Security
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master # intentionally unpinned, same as HACS

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: python3 -m unittest discover tests -v
