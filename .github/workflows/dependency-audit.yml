name: Dependency audit

# The integration's runtime requirements live only in manifest.json, which
# neither Dependabot nor GitHub's dependency graph reads. This job turns them
# into a requirements file and audits it with pip-audit, so a CVE in a
# dependency is reported even though no Dependabot alert will ever name it.
# Requirements are floors (>=), so pip-audit resolves the newest matching
# release -- the same one Home Assistant installs.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  push:
    branches: [main, master]
    paths:
      - 'custom_components/*/manifest.json'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'custom_components/*/manifest.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Extract requirements from manifest.json
        run: |
          set -euo pipefail
          jq -r '.requirements[]' custom_components/*/manifest.json > requirements-audit.txt
          if [ ! -s requirements-audit.txt ]; then
            echo "::error::No requirements found in manifest.json; nothing would be audited."
            exit 1
          fi
          cat requirements-audit.txt

      - name: Audit requirements
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-audit.txt
