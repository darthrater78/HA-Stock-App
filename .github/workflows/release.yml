name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A commit reaching the default branch proves nothing on its own about
  # whether CI passed on it -- only that it was merged. This job is the one
  # place that checks both before anything gets built or published.
  gate:
    runs-on: ubuntu-latest
    # Covers the CI wait loop's own 30-minute deadline plus checkout, so a
    # hung API call cannot hold the job for GitHub's 360-minute default.
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH."
            echo "Releases come from the default branch only."
            exit 1
          fi

      - name: Require a passing CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          # A tag pushed seconds after the merge can arrive before GitHub has
          # registered the merge's CI run, so an empty answer is retried for
          # a short grace period before it counts as "never ran".
          empty_deadline=$(( $(date +%s) + 90 ))
          while true; do
            runs=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.html_url)"')

            if [ -z "$runs" ]; then
              if [ "$(date +%s)" -lt "$empty_deadline" ]; then
                echo "No CI run registered for ${SHA} yet -- waiting."
                sleep 15
                continue
              fi
              echo "::error::CI has never run for ${SHA}, so nothing has tested this commit."
              echo "Push the branch so CI runs on it, or dispatch it by hand" >&2
              echo "(Actions -> CI -> Run workflow), then re-tag." >&2
              exit 1
            fi

            if printf '%s\n' "$runs" | awk '$2 == "success" { hit = 1 } END { exit !hit }'; then
              echo "CI passed for ${SHA}."
              exit 0
            fi

            unfinished=$(printf '%s\n' "$runs" | awk '$1 != "completed"' | wc -l)
            if [ "$unfinished" -eq 0 ]; then
              echo "::error::CI ran for ${SHA} and did not pass. Refusing to release."
              printf '%s\n' "$runs" | sed 's/^/  /' >&2
              exit 1
            fi

            echo "CI is still running for ${SHA} (${unfinished} unfinished) -- waiting."
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI on ${SHA} to finish."
              exit 1
            fi
            sleep 20
          done

  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publishing waits on the "release" environment's protection rules, which
    # live in Settings -> Environments, not in this file: add yourself as a
    # required reviewer and limit deployment tags to v*. Until those rules
    # exist, GitHub creates the environment unprotected and this runs as before.
    # The gate job stays outside it, so approval is only asked for a tag that
    # has already passed every check.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches the version in the tagged commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(jq -r .version custom_components/*/manifest.json)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::No version found in custom_components/*/manifest.json. Refusing to publish."
            exit 1
          fi
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::Tag $TAG is on a commit that declares ${version}. Merge the release first, then tag the merged commit."
            exit 1
          fi
          # ADAPT: a repo with more than one integration has more than one
          # manifest.json -- name the specific one instead of globbing.

      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          : > release-notes.md

          # This repo's changelog lives in README.md under "## Version History"
          # as "### vX.Y.Z -- date". The heading is matched as a literal prefix,
          # not a regex: the dots in a version are not wildcards, and the
          # trailing space stops v2.7.1 from matching v2.7.12's section.
          if [ -f README.md ]; then
            awk -v pfx="### v${version} " '
              index($0, pfx) == 1 { flag = 1; next }
              flag && /^### v/ { exit }
              flag { print }
            ' README.md > release-notes.md
          fi

          # ADAPT: a repo that keeps a CHANGELOG.md instead falls through here.
          if [ ! -s release-notes.md ] && [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { flag = 1; next }
              flag && /^## \[/ { exit }
              flag { print }
            ' CHANGELOG.md > release-notes.md
          fi

          # Trim blank lines from both ends, so a section holding nothing but
          # whitespace still falls through to the placeholder below.
          awk 'NF { seen = 1 } seen' release-notes.md | tac \
            | awk 'NF { seen = 1 } seen' | tac > release-notes.trimmed
          mv release-notes.trimmed release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::warning::No changelog section found for ${version}; publishing a placeholder body."
            echo "Release $version" > release-notes.md
          fi

          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
